<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Keepdalart">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Keepdalart</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Righteous&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 맨 위 이모지+정체성 한 줄 → 목표 8개(달성률만큼 색이 차오름) → 이번에 지킬 것. 목표를 누르면 시트, 편집은 X로 닫는 팝업 */
:root{
  --bg:#111111; --panel:#1C1C1E; --cell:#26262A; --line:#34343A;
  --ink:#F2F0E6; --mute:#9A988F; --y:#EEE3A0; --ydeep:#B8A84E;
  --f-display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 90px);display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center}
.brand .k2{color:#B9B6AB}
.brand{font-family:"Righteous",var(--f-display);font-weight:400;font-size:23px;color:var(--y)}
.icon-btn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.hero{display:flex;align-items:center;gap:12px}
.hero .emo{font-size:40px;line-height:1;width:58px;height:58px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;flex:none}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:27px;line-height:1.2;margin:0;flex:1;word-break:keep-all}
.tiny{background:none;border:1px solid var(--line);border-radius:99px;color:var(--mute);font-size:12px;padding:5px 10px;flex:none}
.banner{background:#2A2718;border:1px solid #4A4426;color:var(--y);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;display:flex;gap:8px;justify-content:space-between;align-items:center}
.banner button{background:var(--y);color:#111;border:0;border-radius:8px;padding:6px 10px;font-weight:700;white-space:nowrap}
/* 목표 8개 */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gt{aspect-ratio:1;border:0;border-radius:16px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;transition:background .4s}
.gt .e{font-size:22px;line-height:1}
.gt b{font-family:var(--f-display);font-weight:400;font-size:15.5px;line-height:1.2;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.gt .p{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.gt.core{background:var(--bg);border:2px solid var(--y);color:var(--y);align-items:center;text-align:center}
.gt.core .yr{font-family:var(--f-display);font-size:22px;line-height:1;height:22px}
.gt.core b{font-size:16px}
.gt.core .p{color:var(--ink)}
.legend{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mute)}
.legend i{flex:1;height:6px;border-radius:9px;background:linear-gradient(90deg,#3A3A40,#EEE3A0)}
.viewtog{align-self:flex-end;background:none;border:0;color:var(--mute);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;padding:0}
/* 9×9 */
.mandal{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.block{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;border-radius:10px;overflow:hidden;border:0;padding:0;background:var(--bg)}
.block.center{outline:1.5px solid var(--y);outline-offset:1px}
.c{aspect-ratio:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px;font-size:8.5px;line-height:1.2;overflow:hidden;word-break:keep-all;border:0}
.c span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.c.goal{font-weight:700;font-size:9px}
.c.core{background:var(--bg);color:var(--y);font-weight:700;font-size:9.5px}
/* 루틴 관리 */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters button{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:13px;color:var(--mute)}
.filters button.on{background:var(--y);border-color:var(--y);color:#111;font-weight:700}
.row.ok{opacity:.55}
.sec-h{display:flex;justify-content:space-between;align-items:baseline}
.sec-h h2{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0}
.sec-h span{font-size:12px;color:var(--mute)}
.todo{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{font-size:12px;color:var(--mute)}
.empty{color:var(--mute);font-size:13px;text-align:center;padding:14px}
.ring{--p:0;width:48px;height:48px;border-radius:50%;border:0;padding:0;flex:none;position:relative;background:conic-gradient(var(--y) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;transition:transform .15s}
.ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel)}
.ring em{position:relative;font-style:normal;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.ring.full::before{background:var(--y)}.ring.full em{color:#111}
.ring:active{transform:scale(.9)}
/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:var(--panel);border-radius:22px 22px 0 0;border-top:1px solid var(--line);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:21;padding:10px 16px calc(env(safe-area-inset-bottom) + 24px)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.inner{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sh-title h3{font-family:var(--f-display);font-weight:400;font-size:23px;margin:0}
.sh-title p{margin:4px 0 0;font-size:13px;color:var(--mute)}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--cell);border:1px solid var(--line);border-radius:14px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.tile .ring{margin:auto 0}.tile .ed{margin-top:auto}
.tile.mid .mc{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}
.tile .hd{display:flex;flex-direction:column;gap:3px;align-items:center;min-height:52px}
.tile .nm{font-size:12.5px;font-weight:700;line-height:1.3;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .std{font-size:10.5px;color:var(--mute)}
.tile .ed{background:none;border:0;color:var(--y);font-size:11.5px;padding:2px 8px;text-decoration:underline;text-underline-offset:3px}
.tile.mid{background:var(--bg);border:1.5px solid var(--y)}
.tile.mid .e{font-size:26px}
.tile.mid b{color:var(--y);font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.25;word-break:keep-all}
.tile.mid .p{font-size:12px;color:var(--ink)}
.tile.mid .ed{color:var(--mute)}
/* 팝업 */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.7)}
.box{width:100%;max-width:440px;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;animation:in .2s ease-out}
@keyframes in{from{transform:scale(.96);opacity:0}}
.box-h{display:flex;justify-content:space-between;align-items:center}
.box-h h3{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0}
.x{background:var(--cell);border:1px solid var(--line);border-radius:50%;width:34px;height:34px;font-size:18px;line-height:1;display:grid;place-items:center;padding:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--mute)}
.field input,.field select,.field textarea{background:var(--cell);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;width:100%}
.field textarea{min-height:150px;font-size:12.5px;font-family:ui-monospace,Menlo,monospace}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{background:var(--cell);border:1px solid var(--line);border-radius:10px;padding:9px 2px;font-size:12.5px}
.seg button.on{background:var(--y);color:#111;border-color:var(--y);font-weight:700}
.note{font-size:12px;color:var(--mute);line-height:1.5;margin:0}
.rec{background:var(--cell);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.rec h4{margin:0;font-size:13px;color:var(--y);font-weight:700}
.btn{border:0;border-radius:12px;padding:13px;font-weight:700;font-size:15px;background:var(--y);color:#111;width:100%}
.btn.ghost{background:var(--cell);color:var(--ink);border:1px solid var(--line)}
.btns{display:flex;flex-direction:column;gap:8px}
.menu-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--cell);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.menu-item b{font-size:15px;font-weight:500}.menu-item small{font-size:12px;color:var(--mute)}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:20px;height:20px;accent-color:#EEE3A0}
.diff{background:var(--cell);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.6;max-height:220px;overflow:auto}
.warn{color:#F0A8A0}
.imgout{width:100%;border-radius:12px}
/* 효과 */
.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;z-index:60;font-family:var(--f-display);font-weight:400;font-size:34px;color:#111;background:var(--y);padding:12px 22px;border-radius:18px;box-shadow:0 10px 40px rgba(238,227,160,.35);white-space:nowrap}
.toast.on{animation:pop 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
.mini{position:fixed;pointer-events:none;z-index:59;font-weight:700;font-size:15px;color:var(--y);animation:rise .8s ease-out forwards}
@keyframes rise{to{transform:translateY(-36px);opacity:0}}
.pt{position:fixed;width:10px;height:10px;pointer-events:none;z-index:58;border-radius:2px}
.snack{visibility:hidden;position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translate(-50%,160%);transition:transform .25s;z-index:55;background:#2B2B2F;border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 16px;display:flex;gap:14px;align-items:center;font-size:14px;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px)}
.snack.on{visibility:visible;transform:translate(-50%,0)}
.snack span{overflow:hidden;text-overflow:ellipsis}
.snack button{background:var(--y);color:#111;border:0;border-radius:10px;padding:8px 12px;font-weight:700}
.foot{text-align:center;font-size:11px;color:#5E5C55}
@media (prefers-reduced-motion:reduce){.toast.on{animation:none;opacity:1;transform:translate(-50%,-50%)}.pt{display:none}.sheet,.scrim{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><span class="brand"><span class="k1">Keep</span><span class="k2">dalart</span></span><button class="icon-btn" id="menuBtn">메뉴</button></div>
  <section class="hero"><span class="emo" id="idEmo"></span><h1 id="idText"></h1><button class="tiny" id="idEdit">수정</button></section>
  <div class="banner" id="sampleBanner" hidden><span>지금 보이는 건 예시예요. AI로 만든 내 만다라트를 붙여넣거나 목표를 눌러 직접 고치세요.</span><button id="bannerPaste">붙여넣기</button></div>
  <section class="board" id="board" aria-label="목표 8개"></section>
  <section class="mandal" id="mandal" aria-label="만다라트 9×9" hidden></section>
  <button class="viewtog" id="viewTog">9×9 전체 보기</button>
  <section class="todo">
    <div class="sec-h"><h2>루틴 관리</h2><span id="todoCount"></span></div>
    <div class="filters" id="filters"></div>
    <div id="todoList" class="todo"></div>
  </section>
  <div class="foot">Keepdalart by 김비버 · 데이터는 이 기기에만 저장돼요. 메뉴에서 가끔 백업해 주세요.</div>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="inner" id="sheetIn"></div></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"><div class="box" id="box"></div></div>
<div class="toast" id="toast"></div>
<div class="snack" id="snack" role="status"><span id="snackT"></span><button id="snackU">되돌리기</button></div>

<script>
/* ---------- 기본 ---------- */
const KEY="mandal.v2",OLDKEY="mandal.v1",UNDO="mandal.undo";
const $=id=>document.getElementById(id);
const PER={day:"일",week:"주",month:"월"},PERW={day:"매일",week:"매주",month:"매달"},PERDONE={day:"오늘 완료!",week:"이번 주 완료!",month:"이번 달 완료!"};
const KIND={count:"횟수",total:"누적 수치",percent:"퍼센트",once:"한 번 달성"};
const KMAP={"횟수":"count","누적":"total","누적 수치":"total","퍼센트":"percent","%":"percent","한번":"once","한 번":"once","한 번 달성":"once"};
const PMAP={"일":"day","매일":"day","주":"week","매주":"week","월":"month","매달":"month",day:"day",week:"week",month:"month"};
const SLOT=[0,1,2,5,8,7,6,3];
const pad=n=>String(n).padStart(2,"0"),ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),today=()=>ymd(new Date());
function monday(d){const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function pkey(s,p){if(p==="day")return s;if(p==="week")return ymd(monday(new Date(s+"T00:00:00")));return s.slice(0,7)}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=x=>Math.round(Math.max(0,Math.min(1,x))*100)+"%";
const EMO=[["건강|집밥|식단|밥","🥗"],["체력|걷기|운동|헬스|러닝","🏃"],["돈|가계부|저축|재테크|투자","💰"],["관계|연락|친구|가족|부모","💌"],["마음|일기|감정|명상","📓"],["공간|정리|청소|집","🧹"],["독서|책|생각|공부|배움","📚"],["취미|시간|여행|쉼","🎨"],["일|커리어|업무|회사","💼"],["연애|사랑","💗"]];
const emojiFor=n=>{for(const [k,e] of EMO)if(new RegExp(k).test(n||""))return e;return "🎯"};

/* ---------- 예시 ---------- */
function sample(){
  const G=[["집밥으로 건강 지키기",[["주 3회 집밥","count","week",3,"회"],["일요일 장보기 리스트","count","week",1,"회"],["주말 밑반찬 만들기","count","week",1,"회"],["집밥 레시피 12개","total","",12,"개",1],["냉동 소분 반찬","count","month",2,"회"],["배달 주 1회 이하","count","week",1,"주"],["도시락 주 2회","count","week",2,"회"],["친구 초대 집밥","count","month",1,"회"]]],
   ["걷기로 체력 지키기",[["하루 6천 보","count","day",1,"일"],["퇴근길 한 정거장","count","week",3,"회"],["점심 후 10분 산책","count","week",3,"회"],["주말 동네 산책","count","week",1,"회"],["계단 이용하기","count","week",3,"회"],["운동화 회사에 두기","once"],["걸음 수 주간 체크","count","week",1,"회"],["둘레길 완주","once"]]],
   ["가계부로 돈 지키기",[["가계부 주 1회 정리","count","week",1,"회"],["월급날 자동이체","count","month",1,"회"],["구독 서비스 점검","count","month",1,"회"],["충동구매 24시간 룰","count","week",1,"주"],["비상금 모으기","total","",300,"만원",10],["무지출 데이","count","week",1,"일"],["연말정산 서류 모으기","once"],["재테크 책 4권","total","",4,"권",1]]],

  if(a.kind==="percent")return{n:a.value,t:100,p:a.value/100,done:a.value>=100};

  while(out.length<500){const k=pkey(ymd(d),a.period);if(k>=end)break;if(!seen.has(k)){seen.add(k);out.push(k)}
    if(a.period==="day")d.setDate(d.getDate()+1);else if(a.period==="week")d.setDate(d.getDate()+7);else d.setMonth(d.getMonth()+1,1)}return out}

    if(show){x.strokeStyle="#EEE3A0";x.lineWidth=3;x.beginPath();x.roundRect(ox+bs+gap+bs/3-1.5,oy+bs+gap+bs/3-1.5,cs+3,cs+3,12);x.stroke()}
    if(show)cell(4,4,S.core,"#111111","#EEE3A0",21,true,S.emoji);
    else cell(4,4,S.core,"#EEE3A0","#111111",21,true,S.emoji);
    S.goals.slice(0,8).forEach((g,i)=>{const r=goalRate(g);const gb=show?mix(r):"#C9BE82",gc=show?fg(r):"#111111";
      cell(4,SLOT[i],g.name,gb,gc,19,true,g.emoji);cell(SLOT[i],4,g.name,gb,gc,19,true,g.emoji);
      g.actions.slice(0,8).forEach((a,j)=>{if(!a.name)return;const rr=rateOf(a);cell(SLOT[i],SLOT[j],a.name,show?mix(rr):"#3A3A40",show?fg(rr):"#F2F0E6",16)})});
    if(!show){const X=ox+bs+gap+cs+3,Y=oy+bs+gap+cs+3;x.strokeStyle="#FFD60A";x.lineWidth=5;x.beginPath();x.roundRect(X-2.5,Y-2.5,cs+5,cs+5,12);x.stroke()}
    x.fillStyle="#5E5C55";x.font="500 22px 'Pretendard Variable',Pretendard,'Apple SD Gothic Neo',sans-serif";x.textBaseline="alphabetic";x.font="30px 'Righteous',sans-serif";const w1=x.measureText("Keep").width,w2=x.measureText("dalart").width,sx=W/2-(w1+w2)/2;x.textAlign="left";x.fillStyle="#EEE3A0";x.fillText("Keep",sx,H-46);x.fillStyle="#8A877C";x.fillText("dalart",sx+w1,H-46);x.textAlign="center";return cv};
  const paint=()=>{const cv=draw();$("imgPrev").src=cv.toDataURL("image/png");return cv};
  modal("만다라트 이미지",`<label class="check"><input type="checkbox" id="im-s" checked> 달성률 색으로 표시하기</label><img class="imgout" id="imgPrev" alt="내 만다라트 미리보기"><button class="btn" id="im-save">이미지로 저장</button>`);
  paint();$("im-s").onchange=e=>{show=e.target.checked;paint()};
  $("im-save").onclick=()=>draw().toBlob(b=>saveBlob(b,`mandalart-${today()}.png`,()=>toast("저장이 막혔어요. 화면 캡처를 써주세요")),"image/png")}

render();
if("serviceWorker" in navigator&&location.protocol==="https:"&&location.hostname.endsWith("github.io"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
